<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPod Image Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131f;
    --border: #1e1e30;
    --text: #e4e4f0;
    --muted: #6b6b80;
    --accent: #7c3aed;
    --accent-glow: #a78bfa;
    --error: #f87171;
    --success: #34d399;
    --radius: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124, 58, 237, 0.08), transparent),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(167, 139, 250, 0.04), transparent);
  }

  .container {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .header {
    text-align: center;
  }

  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text), var(--accent-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.925rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    backdrop-filter: blur(12px);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.925rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  .field input::placeholder { color: #3a3a50; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn:hover { background: #8b4ff7; box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn:disabled:hover { background: var(--accent); box-shadow: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn.loading .spinner { display: block; }
  .btn.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result {
    display: none;
    flex-direction: column;
    gap: 16px;
  }

  .result.visible { display: flex; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .result-card img {
    width: 100%;
    display: block;
  }

  .result-card .url-bar {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .url-bar .url {
    flex: 1;
    font-size: 0.8rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: all;
  }

  .url-bar .copy-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.2s;
  }

  .url-bar .copy-btn:hover { background: #8b4ff7; }
  .url-bar .copy-btn.copied { background: var(--success); }

  .error-msg {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    font-size: 0.875rem;
    color: var(--error);
    display: none;
  }

  .error-msg.visible { display: block; }

  .loading-pulse {
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }

  .loading-pulse.visible { display: flex; }

  .pulse-ring {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }

  .loading-pulse span {
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Image Generator</h1>
    <p>Powered by RunPod + Cloudflare R2</p>
  </div>

  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="api-key">RunPod API Key</label>
      <input type="password" id="api-key" placeholder="rpa_..." required>
    </div>
    <div class="field">
      <label for="prompt">Prompt</label>
      <input type="text" id="prompt" placeholder="A giraffe riding a skateboard" required>
    </div>
    <button type="submit" class="btn" id="submit-btn">
      <span class="btn-text">Generate</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="loading-pulse" id="loading">
    <div class="pulse-ring"></div>
    <span>Generating your image…</span>
  </div>

  <div class="error-msg" id="error"></div>

  <div class="result" id="result">
    <div class="result-card">
      <img id="result-img" src="" alt="Generated image">
      <div class="url-bar">
        <span class="url" id="result-url"></span>
        <button class="copy-btn" id="copy-btn">Copy URL</button>
      </div>
    </div>
  </div>
</div>

<script>
  const ENDPOINT_ID = 'e07zk10pxaxtn0';
  const API_BASE = `https://api.runpod.ai/v2/${ENDPOINT_ID}`;

  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submit-btn');
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');
  const resultImg = document.getElementById('result-img');
  const resultUrl = document.getElementById('result-url');
  const copyBtn = document.getElementById('copy-btn');

  function hideAll() {
    loadingEl.classList.remove('visible');
    errorEl.classList.remove('visible');
    resultEl.classList.remove('visible');
  }

  function showLoading() {
    hideAll();
    loadingEl.classList.add('visible');
  }

  function showError(msg) {
    hideAll();
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
  }

  function showResult(url) {
    hideAll();
    resultImg.src = url;
    resultUrl.textContent = url;
    resultEl.classList.add('visible');
  }

  async function generate(apiKey, prompt) {
    showLoading();
    submitBtn.classList.add('loading');

    try {
      const res = await fetch(`${API_BASE}/runsync`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({ input: { prompt } })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `HTTP ${res.status}: Request failed`);
      }

      if (data.status === 'COMPLETED' && data.output?.image_url) {
        showResult(data.output.image_url);
      } else if (data.status === 'FAILED') {
        throw new Error(data.error || 'Generation failed');
      } else if (data.status === 'IN_QUEUE' || data.status === 'IN_PROGRESS') {
        // runsync returned a pending status — poll for completion
        await pollJob(apiKey, data.id);
      } else {
        throw new Error(`Unexpected response: ${JSON.stringify(data)}`);
      }
    } catch (err) {
      showError(err.message);
    } finally {
      submitBtn.classList.remove('loading');
    }
  }

  async function pollJob(apiKey, jobId) {
    const maxAttempts = 120;
    for (let i = 0; i < maxAttempts; i++) {
      await sleep(2000);

      const res = await fetch(`${API_BASE}/status/${jobId}`, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      const data = await res.json();

      if (data.status === 'COMPLETED' && data.output?.image_url) {
        showResult(data.output.image_url);
        return;
      }
      if (data.status === 'FAILED') {
        throw new Error(data.error || 'Generation failed');
      }
      // IN_QUEUE / IN_PROGRESS — keep polling
    }
    throw new Error('Timed out waiting for the image');
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resultUrl.textContent).then(() => {
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy URL';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const apiKey = document.getElementById('api-key').value.trim();
    const prompt = document.getElementById('prompt').value.trim();
    if (!apiKey || !prompt) return;
    generate(apiKey, prompt);
  });
</script>
</body>
</html>
