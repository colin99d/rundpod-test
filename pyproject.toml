[project]
name = "rundpod-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Colin Delahunty", email = "colin99delahunty@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.39.0",
    "pydantic>=2.0",
    "runpod>=1.11.0",
    "torch>=2.5.0",
    "transformers>=5.14.1",
]

[tool.ty.environment]
# The project uses a src layout without a package, so ty needs
# src on the search path to resolve `model` and other modules.
extra-paths = ["src"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty==0.0.69",
]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "CPY001",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
